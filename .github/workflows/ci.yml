name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # 第一段：静态门禁（快，几分钟内出结果）。失败即终止，不浪费真机检测的机时。
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # tests/ 与 e2e/ 不在主 tsconfig 的 include 内，必须单跑一份（否则 63 个单测 + e2e 无类型保护）
      - run: npx tsc -p tsconfig.test.json --noEmit
      # 带 --coverage：vitest.config.ts 里的 80/80/70 门槛只有跑覆盖率时才生效
      - run: npm run test:coverage -- --run
      # check:architecture 现为 9 项：字号 / rAF / marker / 组件复用 /
      # 物理量标签 / controlMeta / 公式适用条件 / 模块命名 / 物理事实单一真源
      # （颜色字面量由 eslint 统一守，废弃缩放模式已从 TS 类型删除）
      - run: npm run check:architecture
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # 第二段：真机实测（共享单次 preview + 双视口遍历，约 4 分钟）。依赖 static 的 dist 产物——
  # 读 `dist/`，用旧产物会得到假绿。
  runtime:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # 联合真机 DOM 门禁：同一次页面巡检中完成「分段器折行」与「中屏 SVG 压字/被裁」实测
      - run: npm run check:runtime
