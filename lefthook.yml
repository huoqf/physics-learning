pre-commit:
  parallel: false
  commands:
    lint:
      # 用 {**/,} 同时覆盖子目录与仓库根目录：
      # lefthook 的 * 不跨目录分隔符，写成 *.ts 时 src/ 下文件全部匹配不上；
      # 而 **/*.ts 又匹配不到根目录的 vite.config.ts 等文件。
      glob: "{**/,}*.{js,ts,jsx,tsx,mjs,cjs}"
      run: npx eslint . --report-unused-disable-directives --max-warnings 0
    typecheck:
      glob: "{**/,}*.{ts,tsx}"
      run: npx tsc --noEmit
    test:
      run: npx vitest --run
